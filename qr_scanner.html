<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Attendance Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .scanner-section {
            margin-bottom: 30px;
        }
        
        video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            display: block;
            margin-bottom: 15px;
            border: 3px solid #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-start {
            background: #667eea;
            color: white;
        }
        
        .btn-start:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-stop {
            background: #ef5350;
            color: white;
        }
        
        .btn-stop:hover {
            background: #e53935;
            transform: translateY(-2px);
        }
        
        .manual-entry {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-submit {
            width: 100%;
            background: #4caf50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .btn-submit:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .status.success {
            background: #c8e6c9;
            color: #2e7d32;
            display: block;
        }
        
        .status.error {
            background: #ffcdd2;
            color: #c62828;
            display: block;
        }
        
        .status.info {
            background: #bbdefb;
            color: #1565c0;
            display: block;
        }
        
        .qr-result {
            margin-top: 15px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            border-left: 4px solid #4caf50;
            display: none;
        }
        
        .qr-result.show {
            display: block;
        }
        
        .qr-result strong {
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Attendance Scanner</h1>
        <p class="subtitle">Scan QR codes or enter student info manually</p>
        
        <div class="scanner-section">
            <div class="button-group">
                <button class="btn-start" onclick="startScanner()">Start Camera</button>
                <button class="btn-stop" onclick="stopScanner()">Stop Camera</button>
            </div>
            <video id="video" style="display: none;"></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>
        
        <div class="manual-entry">
            <h3 style="margin-bottom: 15px; color: #333;">Manual Entry</h3>
            <div class="form-group">
                <label for="studentId">Student ID:</label>
                <input type="text" id="studentId" placeholder="e.g., STU001">
            </div>
            <div class="form-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" placeholder="e.g., John Doe">
            </div>
            <button class="btn-submit" onclick="submitManual()">Submit Attendance</button>
        </div>
        
        <div id="status" class="status"></div>
        <div id="qrResult" class="qr-result"></div>
    </div>
    
    <script>
        const DEPLOYMENT_URL = "YOUR_DEPLOYMENT_URL_HERE"; // Replace with your deployed URL
        
        let video = null;
        let canvas = null;
        let scanning = false;
        
        function startScanner() {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            scanning = true;
            video.style.display = 'block';
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    video.srcObject = stream;
                    video.addEventListener('play', scanQRCode);
                    showStatus('Camera started. Position QR code in view', 'info');
                })
                .catch(err => {
                    showStatus('Error accessing camera: ' + err.message, 'error');
                    scanning = false;
                });
        }
        
        function stopScanner() {
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                scanning = false;
                showStatus('Camera stopped', 'info');
            }
        }
        
        function scanQRCode() {
            if (!scanning) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            
            if (code) {
                try {
                    const data = JSON.parse(code.data);
                    
                    if (data.studentId && data.studentName) {
                        submitAttendance(data.studentId, data.studentName);
                        stopScanner();
                    }
                } catch (e) {
                    // Not a valid JSON QR code, continue scanning
                }
            }
            
            if (scanning) {
                requestAnimationFrame(scanQRCode);
            }
        }
        
        function submitManual() {
            const studentId = document.getElementById('studentId').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            
            if (!studentId || !studentName) {
                showStatus('Please enter both Student ID and Name', 'error');
                return;
            }
            
            submitAttendance(studentId, studentName);
        }
        
        function submitAttendance(studentId, studentName) {
            showStatus('Recording attendance...', 'info');
            
            const payload = {
                studentId: studentId,
                studentName: studentName
            };
            
            fetch(DEPLOYMENT_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showStatus(`✓ ${data.message}`, 'success');
                    document.getElementById('studentId').value = '';
                    document.getElementById('studentName').value = '';
                    
                    // Show QR result
                    document.getElementById('qrResult').innerHTML = 
                        `<strong>${studentName}</strong> (${studentId}) - Attendance Recorded`;
                    document.getElementById('qrResult').classList.add('show');
                    
                    setTimeout(() => {
                        document.getElementById('qrResult').classList.remove('show');
                    }, 3000);
                } else {
                    showStatus(`Error: ${data.message}`, 'error');
                }
            })
            .catch(error => {
                showStatus(`Error: ${error.message}`, 'error');
            });
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
    </script>
</body>
</html>
